name: deploy-pwa

# Publishes docs/ (the iPhone remote-control PWA) to GitHub Pages.
#
# ONE-TIME SETUP: repo -> Settings -> Pages -> Build and deployment ->
# Source -> "GitHub Actions". (The workflow token cannot turn Pages on by
# itself - that is a GitHub restriction, not a bug here.) Pages also needs
# the repo to be public, or GitHub Pro/Team on a private repo.
#
# After that, this runs on every push under docs/ and on manual dispatch.
# The site URL is printed in the run summary and at Settings -> Pages.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
