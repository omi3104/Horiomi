name: daily-short

on:
  schedule:
    - cron: "0 14 * * *"        # every day 14:00 UTC (GitHub may delay a few min)
  workflow_dispatch:
    inputs:
      topic:
        description: "Force a specific topic (leave blank to auto-pick)"
        required: false
        default: ""
      dry_run:
        description: "Build only, do not upload"
        type: boolean
        default: false

concurrency:
  group: daily-short
  cancel-in-progress: false

permissions:
  contents: write             # to commit data/used_topics.json back

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ vars.WHISPER_MODEL || 'small' }}

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          # all optional - safe if unset:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          VOICE: ${{ vars.VOICE || 'en-US-AndrewNeural' }}
          GEO: ${{ vars.GEO || 'US' }}
          YT_CATEGORY_ID: ${{ vars.YT_CATEGORY_ID || '27' }}
          PRIVACY: ${{ vars.PRIVACY || 'private' }}
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'small' }}
          TOPIC_OVERRIDE: ${{ github.event.inputs.topic }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python -m src.pipeline

      - name: Commit updated topic history
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/used_topics.json
          git commit -m "chore: record today's topic [skip ci]" || echo "nothing to commit"
          git push || echo "push skipped"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: |
            out/
          retention-days: 14
          if-no-files-found: ignore
