name: daily-short

on:
  schedule:
    - cron: "0 14 * * *"        # every day 14:00 UTC (GitHub may delay a few min)
  workflow_dispatch:
    inputs:
      topic:
        description: "Force a specific topic (leave blank to auto-pick)"
        required: false
        default: ""
      dry_run:
        description: "Build only, do not upload"
        type: boolean
        default: false

concurrency:
  group: daily-short
  cancel-in-progress: false

permissions:
  contents: write             # to commit data/*.json back

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so the state commit can rebase + push

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ vars.WHISPER_MODEL || 'small' }}

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          # all optional - safe if unset:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          VOICE: ${{ vars.VOICE || 'en-US-AndrewNeural' }}
          GEO: ${{ vars.GEO || 'US' }}
          YT_CATEGORY_ID: ${{ vars.YT_CATEGORY_ID || '27' }}
          PRIVACY: ${{ vars.PRIVACY || 'private' }}
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'small' }}
          PREFER_VIDEO: ${{ vars.PREFER_VIDEO || 'true' }}
          TARGET_SECONDS_MIN: ${{ vars.TARGET_SECONDS_MIN || '50' }}
          TARGET_SECONDS_MAX: ${{ vars.TARGET_SECONDS_MAX || '80' }}
          TARGET_SECONDS: ${{ vars.TARGET_SECONDS }}
          TTS_RATE: ${{ vars.TTS_RATE || '8' }}
          TOPIC_OVERRIDE: ${{ github.event.inputs.topic }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python -m src.pipeline

      - name: Commit run state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/used_topics.json data/last_run.json || true
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "chore: record run state [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
            echo "push retry $i"; sleep 5
          done

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: |
            out/
          retention-days: 4        # keep well under the 500 MB free artifact cap
          if-no-files-found: ignore
